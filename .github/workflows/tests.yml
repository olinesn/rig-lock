name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python ${{ matrix.python }}${{ matrix.os == 'windows-latest' && ' on Windows' || '' }}${{ matrix.os == 'ubuntu-24.04-arm' && ' on ARM' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 24.04, not ubuntu-latest: on 2026-11-05 ubuntu-latest became 26.04, which has no
        # Python 3.9 for setup-python
        os: [ubuntu-24.04]
        # 3.9: the oldest rig.py runs on (macOS's /usr/bin/python3 is 3.9). 3.12: the Windows machines'
        python: ["3.9", "3.12"]
        include:
          # The Windows machines
          - os: windows-latest
            python: "3.12"
          # ARM64 Linux, as on an NVIDIA Jetson
          - os: ubuntu-24.04-arm
            python: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest
        # rig.py itself is Python's standard library only
        run: python -m pip install pytest
      - name: Test
        # On one worker: most tests run rig.py, which looks at every process on the machine and its CPU and disk
        # load, so they are marked 'alone' and skip themselves under pytest-xdist (tests/conftest.py)
        run: python -m pytest -q -rs --durations=15 tests
